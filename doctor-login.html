<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Doctor sign in | CI Care Intelligence</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="auth-shell">
      <section class="auth-card">
        <a class="brand" href="/" aria-label="CI Care Intelligence home"><img class="brand-logo" src="/logo.png" alt="" /><span>Care Intelligence · Doctor</span></a>
        <p class="eyebrow" style="margin-top:24px">Clinical workspace</p>
        <h1>Welcome back</h1>
        <p class="muted">Sign in to view appointments assigned to you. New accounts can sign in after hospital administrator approval.</p>
        <form id="signinForm">
          <div><label for="email">Work email</label><input id="email" name="email" type="email" autocomplete="username" required /></div>
          <div><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required /></div>
          <button id="submitButton" type="submit">Sign in</button>
        </form>
        <p id="message" class="form-message" role="status"></p>
        <p class="switch">New to CI Care Intelligence? <a href="/doctor-register">Register as a doctor</a></p>
        <p class="switch"><a href="/">Return to home</a></p>
      </section>
    </main>
    <script src="/app.js"></script>
    <script>
      const form = document.getElementById('signinForm');
      const message = document.getElementById('message');
      const submitButton = document.getElementById('submitButton');
      form.addEventListener('submit', async event => {
        event.preventDefault();
        submitButton.disabled = true;
        showMessage(message, 'Signing in…');
        try {
          const result = await apiRequest('/api/doctors/signin', {
            method: 'POST',
            body: JSON.stringify({
              email: document.getElementById('email').value,
              password: document.getElementById('password').value,
            }),
          });
          showMessage(message, result.message);
          location.href = '/doctor';
        } catch (error) {
          showMessage(message, error.message, true);
        } finally {
          submitButton.disabled = false;
        }
      });
    </script>
  </body>
</html>
